[project]
name = "jportal2-generator-vanguardg-sqlalchemy"
version = "2.8.1"
description = "JPortal2 generator that generates SQLAlchemy-based database access for the Vanguard framework"
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "docker>=5.0.3",
    "jsons>=1.6.2",
    "psycopg2-binary>=2.9.3",
    "pytest>=7.1.2",
    "sqlalchemy==1.3.9",
    "testcontainers>=3.5.4,<4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "generated_sources"]

[tool.pyright]
extraPaths = ["generated_sources"]
venvPath = "."
venv = ".venv"

[tool.ruff]
exclude = [
    "tests",
]
line-length = 120

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # Pyflakes
    "PL", # Pylint
]

[tool.ruff.lint.pylint]
max-positional-args = 10
max-args = 10

[tool.mypy]
disallow_untyped_defs = true
strict = true
follow_untyped_imports = true
exclude = [
    "tests/",
    "generated_sources/",
]
